[package]
name = "post-bunny-panel"
version = "0.1.0"
edition = "2021"
description = "Customer operations panel built with GPUI"

[dependencies]
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "macos-blade"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = "=0.2.2"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gpui = "=0.2.2"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
